name: Nuvo stable flow-worker image

on:
  push:
    tags:
      - "nuvo-v*"

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate or hydrate protos
        uses: ./.github/actions/genprotos

      - uses: actions/setup-go@c0137caad775660c0844396c52da96e560aba63d # v6
        with:
          go-version-file: flow/go.mod
          cache-dependency-path: |
            flow/go.sum
            flow/pkg/go.sum

      - name: Install GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev

      - name: Test Snowflake connector
        working-directory: flow
        run: go test ./connectors/snowflake -run '^TestGenerateMergeStatementNullableSchemaDoesNotAddNotNullToCasts$'

      - uses: docker/setup-qemu-action@68827325e0b33c7199a2f1f4f3951e88db11f04a # v3

      - uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish flow-worker
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: stacks/flow.Dockerfile
          target: flow-worker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: PEERDB_VERSION_SHA_SHORT=${{ github.ref_name }}
          tags: |
            ghcr.io/nuvo-tech/peerdb-flow-worker:${{ github.ref_name }}
            ghcr.io/nuvo-tech/peerdb-flow-worker:sha-${{ github.sha }}
          cache-from: type=gha,scope=peerdb-flow-worker
          cache-to: type=gha,mode=max,scope=peerdb-flow-worker
