name: Nuvo stable flow-worker image

on:
  push:
    tags:
      - "nuvo-v*"

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate or hydrate protos
        uses: ./.github/actions/genprotos

      - uses: actions/setup-go@c0137caad775660c0844396c52da96e560aba63d # v6
        with:
          go-version-file: flow/go.mod
          cache-dependency-path: |
            flow/go.sum
            flow/pkg/go.sum

      - name: Install GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev

      - name: Test Nuvo patches
        working-directory: flow
        run: |
          go test ./connectors/snowflake -run '^(TestGenerateNormalizedTableKeepsSnowflakeUserColumnsNullable|TestGenerateMergeStatementKeepsSnowflakeCastsNullable|TestGenerateAddColumnSQL|TestSnowflakeDefaultExpr)$'
          go test ./connectors/postgres -run '^TestConfigureSnapshotSlotConnection'

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish flow-worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: stacks/flow.Dockerfile
          target: flow-worker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: PEERDB_VERSION_SHA_SHORT=${{ github.ref_name }}
          tags: |
            ghcr.io/nuvo-tech/peerdb-flow-worker:${{ github.ref_name }}
            ghcr.io/nuvo-tech/peerdb-flow-worker:sha-${{ github.sha }}
          cache-from: type=gha,scope=peerdb-flow-worker
          cache-to: type=gha,mode=max,scope=peerdb-flow-worker
